name: "Build"
permissions:
  contents: read
  artifact-metadata: read

on:
  workflow_call:
  workflow_dispatch:
  push:

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      manylinux_versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        run: |
          {
            echo 'versions<<EOF'
            cat <<'JSON'
          [
            {"base":"manylinux2014","glibc":"2_17","toolset_path":"/opt/rh/devtoolset-10/root"},
            {"base":"manylinux_2_28","glibc":"2_28","toolset_path":"/opt/rh/gcc-toolset-13/root"}
          ]
          JSON
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: vars
    strategy:
      matrix:
        manylinux: ${{ fromJSON(needs.vars.outputs.manylinux_versions) }}
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            openssl_target: linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            openssl_target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.manylinux
          build-args: |
            BASE_IMAGE=quay.io/pypa/${{ matrix.manylinux.base }}_${{ matrix.arch }}
            OPENSSL_TARGET=${{ matrix.openssl_target }}
            TOOLSET_PATH=${{ matrix.manylinux.toolset_path }}
          push: true
          tags: ghcr.io/${{ github.repository }}:glibc_${{ matrix.manylinux.glibc }}-${{ matrix.arch }}

  manifest:
    needs: [vars, build]
    strategy:
      matrix:
        manylinux: ${{ fromJSON(needs.vars.outputs.manylinux_versions) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:glibc_${{ matrix.manylinux.glibc }} \
            ghcr.io/${{ github.repository }}:glibc_${{ matrix.manylinux.glibc }}-x86_64 \
            ghcr.io/${{ github.repository }}:glibc_${{ matrix.manylinux.glibc }}-aarch64

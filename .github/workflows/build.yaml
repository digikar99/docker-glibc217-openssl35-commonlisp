name: "Build"
permissions:
  contents: read
  artifact-metadata: read

on:
  workflow_call:
  workflow_dispatch:
  push:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            base_image: quay.io/pypa/manylinux2014_x86_64
            openssl_target: linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base_image: quay.io/pypa/manylinux2014_aarch64
            openssl_target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.manylinux2014
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            OPENSSL_TARGET=${{ matrix.openssl_target }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }} \
            ghcr.io/${{ github.repository }}:x86_64 \
            ghcr.io/${{ github.repository }}:aarch64
